<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YaluMart - Seller</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .seller-box {
            background: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .seller-box input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .seller-box button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        #sellerProducts {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px;
        }

        .seller-card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
            text-align: center;
        }

        .seller-card button {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 YaluMart</h1>
    <p>Seller Dashboard</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="orders.html">Orders</a>
    <a href="seller.html">Seller</a>
    <a href="admin.html">Admin</a>
</nav>

<main>

    <h2>🏪 Seller Dashboard</h2>

    <div class="seller-box">

        <h3>➕ Add Product</h3>

        <input
            type="text"
            id="productName"
            placeholder="Product Name">

        <input
            type="number"
            id="productPrice"
            placeholder="Product Price">

        <input
            type="number"
            id="productQuantity"
            placeholder="Quantity">

        <br><br>

        <button type="button" onclick="addProduct()">
            Add Product
        </button>

    </div>

    <h2>📦 Seller Products</h2>

    <div id="sellerProducts">
        <p>No products added yet.</p>
    </div>

</main>

<footer>
    <p>© 2026 YaluMart. All Rights Reserved.</p>
</footer>


<script>
const API = "https://yalumart-f1hi.onrender.com/api/products";

async function showProducts() {
    const container = document.getElementById("sellerProducts");
    container.innerHTML = "<p>Loading products...</p>";

    try {
        const response = await fetch(API);
        if (!response.ok) throw new Error("HTTP " + response.status);

        const products = await response.json();
        container.innerHTML = "";

        if (products.length === 0) {
            container.innerHTML = "<p>No products added yet.</p>";
            return;
        }

        products.forEach(product => {
            const card = document.createElement("div");
            card.className = "seller-card";

            const title = document.createElement("h3");
            title.textContent = "🛍️ " + product.name;

            const price = document.createElement("p");
            price.textContent = "Price: ₹" + product.price;

            const quantity = document.createElement("p");
            quantity.textContent = "Quantity: " + product.quantity;

            const button = document.createElement("button");
            button.textContent = "Delete";
            button.onclick = () => deleteProduct(product.id);

            card.append(title, price, quantity, button);
            container.appendChild(card);
        });
    } catch (error) {
        console.error(error);
        container.innerHTML =
            "<p>Unable to load products. Please try again.</p>";
    }
}

async function addProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const quantity = Number(document.getElementById("productQuantity").value);

    if (!name ||
        document.getElementById("productPrice").value === "" ||
        document.getElementById("productQuantity").value === "" ||
        !Number.isFinite(price) || price < 0 ||
        !Number.isInteger(quantity) || quantity < 0) {
        alert("Enter a valid name, price and quantity.");
        return;
    }

    try {
        const response = await fetch(API + "/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, price, quantity })
        });

        const result = await response.json();

        if (!response.ok || result.error) {
            throw new Error(result.error || "Could not add product");
        }

        alert(result.message || "Product added successfully!");

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productQuantity").value = "";

        await showProducts();
    } catch (error) {
        console.error(error);
        alert("Unable to add product. Check the API connection.");
    }
}

async function deleteProduct(id) {
    if (!confirm("Delete this product?")) return;

    try {
        const response = await fetch(API + "/" + id, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok || result.error) {
            throw new Error(result.error || "Could not delete product");
        }

        await showProducts();
    } catch (error) {
        console.error(error);
        alert("Unable to delete product.");
    }
}

showProducts();
</script>
