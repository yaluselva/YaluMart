<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YaluMart - Seller</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .seller-box {
            background: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .seller-box input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .seller-box button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        #sellerProducts {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px;
        }

        .seller-card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
            text-align: center;
        }

        .seller-card button {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 YaluMart</h1>
    <p>Seller Dashboard</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="orders.html">Orders</a>
    <a href="seller.html">Seller</a>
    <a href="admin.html">Admin</a>
</nav>

<main>

    <h2>🏪 Seller Dashboard</h2>

    <div class="seller-box">

        <h3>➕ Add Product</h3>

        <input
            type="text"
            id="productName"
            placeholder="Product Name">

        <input
            type="number"
            id="productPrice"
            placeholder="Product Price">

        <input
            type="number"
            id="productQuantity"
            placeholder="Quantity">

        <br><br>

        <button type="button" onclick="addProduct()">
            Add Product
        </button>

    </div>

    <h2>📦 Seller Products</h2>

    <div id="sellerProducts">
        <p>No products added yet.</p>
    </div>

</main>

<footer>
    <p>© 2026 YaluMart. All Rights Reserved.</p>
</footer>

<script>

async function addProduct()
{
    const name =
        document.getElementById("productName").value.trim();

    const price =
        document.getElementById("productPrice").value;

    const quantity =
        document.getElementById("productQuantity").value;

    if (name === "" || price === "" || quantity === "")
    {
        alert("Please enter all product details!");
        return;
    }

    try
    {
        const response = await fetch(
            "http://localhost:8080/api/products/add",
            {
                method: "POST",
                headers:
                {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(
                {
                    name: name,
                    price: Number(price),
                    quantity: Number(quantity)
                })
            }
        );

        const result = await response.json();

        alert(result.message);

        if (result.success)
        {
            showProducts();
        }
    }
    catch (error)
    {
        console.log(error);
        alert("Unable to connect to YaluMart API!");
    }
}

function showProducts()
{
    let products =
        JSON.parse(
            localStorage.getItem("yaluSellerProducts")
        ) || [];

    const container =
        document.getElementById("sellerProducts");

    container.innerHTML = "";

    if (products.length === 0)
    {
        container.innerHTML =
            "<p>No products added yet.</p>";
        return;
    }

    products.forEach(function(product, index)
    {
        const card =
            document.createElement("div");

        card.className = "seller-card";

        card.innerHTML =
            "<h3>🛍️ " + product.name + "</h3>" +
            "<p>Price: ₹" + product.price + "</p>" +
            "<p>Quantity: " + product.quantity + "</p>" +
            "<button onclick='deleteProduct(" + index + ")'>Delete</button>";

        container.appendChild(card);
    });
}

function deleteProduct(index)
{
    let products =
        JSON.parse(
            localStorage.getItem("yaluSellerProducts")
        ) || [];

    products.splice(index, 1);

    localStorage.setItem(
        "yaluSellerProducts",
        JSON.stringify(products)
    );

    showProducts();
}

showProducts();

</script>



</body>
</html>
