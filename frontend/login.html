<!DOCTYPE html>
<html>
<head>
    <title>YaluMart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 YaluMart</h1>
    <p>Login to your account</p>
</header>

<main>
    <div class="product">
        <h2>Login</h2>

        <input type="email" id="loginEmail" placeholder="Email">
        <br><br>

        <input type="password" id="loginPassword" placeholder="Password">
        <br><br>

        <button type="button" onclick="loginUser()">Login</button>

        <p>Don't have an account?</p>

        <a href="register.html">
            <button type="button">Register</button>
        </a>

        <p id="loginMessage"></p>
    </div>
</main>

<script>
async function loginUser() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
    }

    message.textContent = "Checking login...";

    try {
        const response = await fetch(
            "https://yalumart-f1hi.onrender.com/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            }
        );

        const result = await response.json();

        if (response.ok && result.success) {
            const user = result.user || { email: email };

            // Store only the returned user details, never the password.
            localStorage.setItem("loggedInUser", JSON.stringify(user));

            message.textContent = "Login successful!";
            window.location.href = "buyer.html";
        } else {
            message.textContent =
                result.message || "Invalid email or password.";
        }

    } catch (error) {
        message.textContent =
            "Unable to connect to YaluMart API. Please try again.";
    }
}
</script>

</body>
</html>
